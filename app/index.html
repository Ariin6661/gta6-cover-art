<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Coast Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <header>
      <h1><span class="brand-a">Vice Coast</span> <span class="brand-b">Cover Studio</span></h1>
      <p class="tagline">Turn your photos into GTA-style cover art. Everything stays on your machine.</p>
    </header>

    <section>
      <h2>1 · Photos</h2>
      <label class="upload-btn" for="upload">Upload photos</label>
      <input type="file" id="upload" accept="image/*" multiple hidden>
      <div id="sampleRow" class="chips"></div>
      <div id="panelList"></div>
      <button id="fillAll" type="button">Use this photo in every panel</button>
    </section>

    <section>
      <h2>2 · Layout &amp; Grade</h2>
      <div id="layoutRow" class="pills"></div>
      <div id="gradeRow" class="pills"></div>
    </section>

    <section>
      <h2>3 · Caption</h2>
      <label class="field">Title
        <input id="title" type="text" value="VICE COAST">
      </label>
      <label class="field">Subtitle
        <input id="subtitle" type="text" value="sunset heist">
      </label>
      <label class="field">Badge
        <input id="badge" type="text" value="EST. 2026">
      </label>
      <p id="panelReadout"></p>
      <label class="field">Zoom
        <input id="zoom" type="range" min="0.5" max="4" step="0.05" value="1">
      </label>
      <button id="centerPanel" type="button">Centre the photo</button>
    </section>

    <section>
      <h2>4 · Export</h2>
      <div id="sizeRow" class="pills"></div>
      <button id="export" type="button">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </aside>

  <main class="stage">
    <canvas id="preview" width="900" height="900"></canvas>
    <p class="hint">Click a panel to select it · drag its photo to move it · scroll to zoom</p>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
